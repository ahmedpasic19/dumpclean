name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: dumpclean-windows-x86_64.exe
            bin_path: crates/dumpclean/target/x86_64-pc-windows-msvc/release/dumpclean.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: dumpclean-linux-x86_64
            bin_path: crates/dumpclean/target/x86_64-unknown-linux-gnu/release/dumpclean
          - os: macos-14
            target: aarch64-apple-darwin
            asset_name: dumpclean-macos-aarch64
            bin_path: crates/dumpclean/target/aarch64-apple-darwin/release/dumpclean
          - os: macos-14
            target: x86_64-apple-darwin
            asset_name: dumpclean-macos-x86_64
            bin_path: crates/dumpclean/target/x86_64-apple-darwin/release/dumpclean

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build
        working-directory: crates/dumpclean
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          cp "${{ matrix.bin_path }}" "${{ matrix.asset_name }}"
          ls -la "${{ matrix.asset_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
